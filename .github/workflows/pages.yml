name: landing page

# Publishes site/ to the gh-pages branch, which GitHub Pages serves. Only
# the files the page is built from trigger it, so a code-only push does not
# redeploy.
on:
  push:
    branches: [ master ]
    paths:
      - 'site/**'
      - 'demo.gif'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Two runs pushing the same branch would race, and the second is the one
# worth keeping.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Publish to gh-pages
    runs-on: ubuntu-latest
    # The default token is read-only; pushing the branch needs write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: site/build.sh
      # Plain git rather than a third-party publish action: this pushes to
      # our own repository with the token the runner already has, in five
      # commands. gh-pages is a build artifact, not a history, so each run
      # replaces it outright. The token arrives as an environment variable
      # rather than pasted into the script text, so it is never part of the
      # command this step is built from.
      - name: Push the branch
        working-directory: _site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Site built from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" gh-pages
